# Rebuilds the SVG assets and README whenever the generators or the data
# change, and commits the result back.
#
# It deliberately does NOT run on every push to main -- that would create a
# commit loop, since the job itself pushes to main. It only runs when a file
# that actually affects the output has changed.

name: Build assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/**.py"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install step. The generators use the standard library only.
      - name: Regenerate assets
        run: python3 scripts/build_assets.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "chore: rebuild assets"
          git push
