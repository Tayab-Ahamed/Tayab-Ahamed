<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Tayab Ahamed N -- AI Research and Engineering Lab</title><desc id="d">Title card. The question: what happens when the model is wrong? Twelve experiments arranged on a ring in four divisions -- autonomous agents, grounded retrieval, perception and vision, systems and simulation -- joined by thirteen shared-technology links. Readouts: 12 experiments, 4 divisions, 5 months, 1 live deployment.</desc><style>.fu{animation:fu .75s cubic-bezier(.16,.84,.44,1) both}@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fi{animation:fi .9s ease both}@keyframes fi{from{opacity:0}to{opacity:1}}.dr{animation:dr 1.5s cubic-bezier(.4,0,.2,1) both}@keyframes dr{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 3.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.14;transform:scale(1)}50%{opacity:.42;transform:scale(1.85)}}@media(prefers-reduced-motion:reduce){.fu,.fi,.dr,.pu{animation:none!important}}</style><rect x="0" y="0" width="1200" height="520" rx="0" fill="#0C0C0B"/><g class="fu"><text x="56" y="62" font-size="11" fill="#F4F4F1" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.4">TAYAB AHAMED N</text><line x1="208" y1="52" x2="208" y2="66" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><text x="224" y="62" font-size="10" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2.4">AI RESEARCH AND ENGINEERING LAB</text><text x="1144" y="62" font-size="10" fill="#6A6A63" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2.4">EST 2026</text></g><g class="fu" style="animation-delay:0.05s"><line x1="56" y1="84" x2="1144" y2="84" stroke="#282826" stroke-width="1" stroke-linecap="butt"/></g><g class="fu" style="animation-delay:0.12s"><text x="56" y="196" font-size="50" fill="#A0A099" font-weight="300">What happens when</text></g><g class="fu" style="animation-delay:0.22s"><text x="56" y="252" font-size="50" fill="#F4F4F1" font-weight="600">the model is wrong?</text></g><g class="fu" style="animation-delay:0.34s"><text x="56" y="296" font-size="14" fill="#A0A099" font-weight="400">Twelve experiments in one laboratory.</text><text x="56" y="318" font-size="14" fill="#A0A099" font-weight="400">Every one of them assumes the answer can be wrong, and does something about it.</text></g><g class="fu" style="animation-delay:0.5s"><text x="56" y="424" font-size="30" fill="#F4F4F1" font-weight="600">12</text><text x="56" y="444" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2">EXPERIMENTS</text></g><g class="fu" style="animation-delay:0.57s"><text x="188" y="424" font-size="30" fill="#F4F4F1" font-weight="600">4</text><text x="188" y="444" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2">DIVISIONS</text></g><g class="fu" style="animation-delay:0.64s"><text x="320" y="424" font-size="30" fill="#F4F4F1" font-weight="600">5</text><text x="320" y="444" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2">MONTHS</text></g><g class="fu" style="animation-delay:0.71s"><text x="452" y="424" font-size="30" fill="#F4F4F1" font-weight="600">1</text><text x="452" y="444" font-size="8.5" fill="#