<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Repository relationship matrix</title><desc id="d">A matrix of ten shared layers against the twelve repositories. A filled cell means that repository uses that layer. The layers are model routing, deterministic fallback, grounding and citation, weighted scoring, vector retrieval, vision inference, FastAPI services, React front ends, container and cluster, and simulate before shipping.</desc><rect x="0" y="0" width="1200" height="654" rx="0" fill="#FFFFFF"/><text x="56" y="46" font-size="10.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.2">REPOSITORY RELATIONSHIPS</text><text x="56" y="74" font-size="17" fill="#171715" font-weight="600">What the systems share</text><text x="56" y="96" font-size="12.5" fill="#63635D" font-weight="400">A filled cell means the repository uses that layer. Read across for who shares a decision;</text><text x="56" y="113" font-size="12.5" fill="#63635D" font-weight="400">read down for what a system is made of.</text><g transform="translate(340.92,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">FaultSeeker-</text></g><text x="340.92" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">01</text><rect x="331.92" y="606" width="18" height="2.5" rx="1.25" fill="#3D7DE8"/><g transform="translate(410.75,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">StudyMind</text></g><text x="410.75" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">02</text><rect x="401.75" y="606" width="18" height="2.5" rx="1.25" fill="#4F8F6C"/><g transform="translate(480.58,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">Pothole-Detection</text></g><text x="480.58" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">03</text><rect x="471.58" y="606" width="18" height="2.5" rx="1.25" fill="#B07C34"/><g transform="translate(550.42,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">Deploy-Platform</text></g><text x="550.42" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">04</text><rect x="541.42" y="606" width="18" height="2.5" rx="1.25" fill="#7E6EAF"/><g transform="translate(620.25,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">RepoMedic-Agent</text></g><text x="620.25" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">05</text><rect x="611.25" y="606" width="18" height="2.5" rx="1.25" fill="#3D7DE8"/><g transform="translate(690.08,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">LifeSim-AI</text></g><text x="690.08" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">06</text><rect x="681.08" y="606" width="18" height="2.5" rx="1.25" fill="#7E6EAF"/><g transform="translate(759.92,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">ecosentinel</text></g><text x="759.92" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">07</text><rect x="750.92" y="606" width="18" height="2.5" rx="1.25" fill="#B07C34"/><g transform="translate(829.75,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">SETRS-Trajectory-Preemption</text></g><text x="829.75" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">08</text><rect x="820.75" y="606" width="18" height="2.5" rx="1.25" fill="#7E6EAF"/><g transform="translate(899.58,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">AI-Sakhi</text></g><text x="899.58" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">09</text><rect x="890.58" y="606" width="18" height="2.5" rx="1.25" fill="#4F8F6C"/><g transform="translate(969.42,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">neuroops</text></g><text x="969.42" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="960.42" y="606" width="18" height="2.5" rx="1.25" fill="#3D7DE8"/><g transform="translate(1039.25,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">vetaid-rag-assistant</text></g><text x="1039.25" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">11</text><rect x="1030.25" y="606" width="18" height="2.5" rx="1.25" fill="#4F8F6C"/><g transform="translate(1109.08,222) rotate(-52)"><text x="0" y="0" font-size="10.5" fill="#63635D" font-weight="400">ReloopAI</text></g><text x="1109.08" y="598" font-size="8.5" fill="#9C9C95" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">12</text><rect x="1100.08" y="606" width="18" height="2.5" rx="1.25" fill="#B07C34"/><line x1="56" y1="230" x2="1144" y2="230" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><rect x="56" y="236" width="1088" height="34" rx="4" fill="#FAFAF9"/><text x="64" y="252" font-size="12" fill="#171715" font-weight="600">Model routing</text><text x="64" y="265" font-size="10" fill="#9C9C95" font-weight="400">more than one provider behind one interface</text><circle cx="340.92" cy="253" r="5.6" fill="#3D7DE8"/><circle cx="410.75" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="480.58" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="550.42" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="620.25" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="690.08" cy="253" r="5.6" fill="#7E6EAF"/><circle cx="759.92" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="829.75" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="899.58" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="969.42" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="1039.25" cy="253" r="1.5" fill="#E3E3E0"/><circle cx="1109.08" cy="253" r="5.6" fill="#B07C34"/><text x="1142" y="257" font-size="11" fill="#9C9C95" font-weight="400" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">3</text><text x="64" y="286" font-size="12" fill="#171715" font-weight="600">Deterministic fallback</text><text x="64" y="299" font-size="10" fill="#9C9C95" font-weight="400">runs correctly with no model available</text><circle cx="340.92" cy="287" r="5.6" fill="#3D7DE8"/><circle cx="410.75" cy="287" r="1.5" fill="#E3E3E0"/><circle cx="480.58" cy="287" r="1.5" fill="#E3E3E0"/><circle cx="550.42" cy="287" r="1.5" fill="#E3E3E0"/><circle cx=