<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Tayab Ahamed N -- AI Research and Engineering Lab</title><desc id="d">Title card. The question: what happens when the model is wrong? 17 experiments arranged on a ring in five divisions -- autonomous agents, grounded retrieval, perception and vision, systems and simulation, security and assurance -- joined by the technologies they share. Readouts: 17 experiments, 5 divisions, 6 months, 1 live deployment.</desc><style>.fu{animation:fu .75s cubic-bezier(.16,.84,.44,1) both}@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fi{animation:fi .9s ease both}@keyframes fi{from{opacity:0}to{opacity:1}}.dr{animation:dr 1.5s cubic-bezier(.4,0,.2,1) both}@keyframes dr{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 3.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.14;transform:scale(1)}50%{opacity:.42;transform:scale(1.85)}}@media(prefers-reduced-motion:reduce){.fu,.fi,.dr,.pu{animation:none!important}}</style><rect x="0" y="0" width="1200" height="580" rx="0" fill="#FFFFFF"/><g class="fu"><text x="56" y="62" font-size="11" fill="#171715" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.4">TAYAB AHAMED N</text><line x1="208" y1="52" x2="208" y2="66" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><text x="224" y="62" font-size="10" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2.4">AI RESEARCH AND ENGINEERING LAB</text><text x="1144" y="62" font-size="10" fill="#9C9C95" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2.4">EST 2026</text></g><line x1="56" y1="84" x2="1144" y2="84" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><g class="fu" style="animation-delay:0.06s"><text x="56" y="168" font-size="42" fill="#171715" font-weight="600">What happens</text><text x="56" y="220" font-size="42" fill="#171715" font-weight="600">when the model</text><text x="56" y="272" font-size="42" fill="#171715" font-weight="600">is wrong?</text></g><g class="fu" style="animation-delay:0.12s"><text x="56" y="330" font-size="13.5" fill="#63635D" font-weight="400">17 experiments in five divisions. Each one takes a single</text><text x="56" y="352" font-size="13.5" fill="#63635D" font-weight="400">question into a different domain: what the system does when</text><text x="56" y="374" font-size="13.5" fill="#63635D" font-weight="400">the model is uncertain, unavailable or simply wrong.</text></g><line x1="56" y1="420" x2="560" y2="420" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="56" y="466" font-size="30" fill="#171715" font-weight="600">17</text><text x="56" y="490" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">EXPERIMENTS</text><text x="156.1" y="466" font-size="30" fill="#171715" font-weight="600">5</text><text x="156.1" y="490" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">DIVISIONS</text><text x="244.1" y="466" font-size="30" fill="#171715" font-weight="600">6</text><text x="244.1" y="490" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">MONTHS</text><text x="332.1" y="466" font-size="30" fill="#171715" font-weight="600">1</text><text x="332.1" y="490" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">LIVE DEPLOYMENT</text><g class="fi" style="animation-delay:0.3s"><circle cx="880" cy="300" r="168" fill="none" stroke="#E3E3E0" stroke-width="1"/><circle cx="880" cy="300" r="122" fill="none" stroke="#E3E3E0" stroke-width="1" opacity="0.5"/><line x1="880" y1="132" x2="718.41" y2="345.98" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt" opacity="0.55" stroke-dasharray="268.13" class="dr" style="--L:268.13;animation-delay:0.45s"/><line x1="1041.59" y1="345.98" x2="791.56" y2="442.84" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt" opacity="0.55" stroke-dasharray="268.13" class="dr" style="--L:268.13;animation-delay:0.48s"/><line x1="1014.07" y1="401.24" x2="968.44" y2="442.84" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt" opacity="0.55" stroke-dasharray="61.74" class="dr" style="--L:61.74;animation-delay:0.51s"/><line x1="1014.07" y1="401.24" x2="849.13" y2="465.14" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt" opacity="0.55" stroke-dasharray="176.88" class="dr" style="--L:176.88;animation-delay:0.54s"/><line x1="1014.07" y1="401.24" x2="791.56" y2="442.84" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt" opacity="0.55" stroke-dasharray="226.36" class="dr" style="--L:226.36;animation-delay:0.57s"/><line x1="849.13" y1="465.14" x2="791.56" y2="442.84" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt" opacity="0.55" stroke-dasharray="61.74" class="dr" style="--L:61.74;animation-delay:0.6s"/><line x1="849.13" y1="465.14" x2="718.41" y2="345.98" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt" opacity="0.55" stroke-dasharray="176.88" class="dr" style="--L:176.88;animation-delay:0.63s"/><line x1="791.56" y1="442.84" x2="718.41" y2="345.98" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt" opacity="0.55" stroke-d