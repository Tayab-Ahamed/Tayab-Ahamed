<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Tayab Ahamed N -- AI Research and Engineering Lab</title><desc id="d">Title card. The question: what happens when the model is wrong? 17 experiments arranged on a ring in five divisions -- autonomous agents, grounded retrieval, perception and vision, systems and simulation, security and assurance -- joined by the technologies they share. Readouts: 17 experiments, 5 divisions, 6 months, 1 live deployment.</desc><style>.fu{animation:fu .75s cubic-bezier(.16,.84,.44,1) both}@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fi{animation:fi .9s ease both}@keyframes fi{from{opacity:0}to{opacity:1}}.dr{animation:dr 1.5s cubic-bezier(.4,0,.2,1) both}@keyframes dr{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 3.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.14;transform:scale(1)}50%{opacity:.42;transform:scale(1.85)}}@media(prefers-reduced-motion:reduce){.fu,.fi,.dr,.pu{animation:none!important}}</style><rect x="0" y="0" width="1200" height="580" rx="0" fill="#FFFFFF"/><g class="fu"><text x="56" y="62" font-size="11" fill="#171715" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.4">TAYAB AHAMED N</text><line x1="208" y1="52" x2="208" y2="66" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><text x="224" y="62" font-size="10" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2.4">AI RESEARCH AND ENGINEERING LAB</text><text x="1144" y="62" font-size="10" fill="#9C9C95" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2.4">EST 2026</text></g><line x1="56" y1="84" x2="1144" y2="84" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><g class="fu" style="animation-delay:0.06s"><text x="56" y="168" font-size="42" fill="#171715" font-weight="600">What happens</text><text x="56" y="220" font-size="42" fill="#171715" font-weight="600">when the model</text><text x="56" y="272" font-size="42" fill="#171715" font-weight="600">is wrong?</text></g><g class="fu" style="animation-delay:0.12s"><text x="56" y="330" font-size="13.5" fill="#63635D" font-weight="400">17 experiments in five divisions. Each one takes a single</text><text x="56" y="352" font-size="13.5" fill="#63635D" font-weight="400">question into a different domain: what the system does when</text><text x="56" y="374" font-size="13.5" fill="#63635D" font-weight="400">the model is uncertain, unavailable or simply wrong.</text></g><line x1="56" y1="420" x2="560" y2="420" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="56" y="466" font-size="30" fill="#171715" font-weight="600">17</text><text x="56" y="490" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">EXPERIMENTS</text><text x="156.1" y="466" font-size="30" fill="#171715" font-weight="600">5</text><text x="156.1" y="490" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">DIVISIONS</text><text x="244.1" y="466" font-size="30" fill="#171715" font-weight="600">6</text><text x="244.1" y="490" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">MONTHS</text><text x="332.1" y="466" font-size="30" fill="#171715" font-weight="600">1</text><text x="332.1" y="490" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">LIVE DEPLOYMENT</text><g class="fu" style="animation-delay:0.16s"><text x="660" y="116" font-size="9" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2.4">THE 17 EXPERIMENTS</text><text x="660" y="138" font-size="11.5" fill="#63635D" font-weight="400">One dot per repository, grouped by division.</text><text x="660" y="155" font-size="11.5" fill="#63635D" font-weight="400">A line joins two that share three or more technologies.</text></g><g class="fi" style="animation-delay:0.3s"><circle cx="880" cy="322" r="138" fill="none" stroke="#E3E3E0" stroke-width="1"/><path d="M860.82 170.21 A153 153 0 0 1 1032.92 327.09" fill="none" stroke="#3D7DE8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="993.85" y="200.61" font-size="10" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">5</text><path d="M1031.25 345.1 A153 153 0 0 1 943.61 461.15" fill="none" stroke="#4F8F6C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="1014.86" y="427.35" font-size="10" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">3</text><path d="M926.74 467.69 A153 153 0 0 1 783.79 440.96" fill="none" stroke="#B07C34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="848.95" y="491.62" font-size="10" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">3</text><path d="M770.42 42