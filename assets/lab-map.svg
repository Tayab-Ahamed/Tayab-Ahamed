<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 732" width="1200" height="732" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Lab map: five research divisions</title><desc id="d">The 17 repositories arranged as five research divisions. Division 01 autonomous agents: FaultSeeker, RepoMedic-Agent, neuroops, Airgap NOC Copilot, RecoverOS. Division 02 grounded retrieval: StudyMind, AI-Sakhi, VetAid. Division 03 perception and vision: Pothole-Detection, ecosentinel, ReloopAI. Division 04 systems and simulation: Deploy-Platform, LifeSim-AI, SETRS. Division 05 security and assurance: Sentinel-FL, Actionguard Autoaudit, Actionguard CI.</desc><rect x="0" y="0" width="1200" height="732" rx="0" fill="#FFFFFF"/><text x="56" y="46" font-size="10.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.2">LAB MAP</text><text x="56" y="74" font-size="17" fill="#171715" font-weight="600">Five divisions. Seventeen experiments.</text><text x="56" y="96" font-size="12.5" fill="#63635D" font-weight="400">Grouped by the question the work is asking, not by language.</text><line x1="56" y1="112" x2="1144" y2="112" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><rect x="56" y="132" width="344" height="3" rx="1.5" fill="#3D7DE8"/><text x="56" y="158" font-size="9" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.8">DIVISION 01</text><text x="56" y="178" font-size="14.5" fill="#171715" font-weight="600">Autonomous Agents</text><text x="56" y="198" font-size="11.5" fill="#63635D" font-weight="400">Can a system diagnose a fault and act on it</text><text x="56" y="213" font-size="11.5" fill="#63635D" font-weight="400">without a human in the loop?</text><rect x="56" y="228" width="344" height="164" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="56" y="240" width="2.5" height="140" rx="1.25" fill="#3D7DE8"/><text x="72" y="254" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">01</text><text x="98" y="254" font-size="12.5" fill="#171715" font-weight="500">FaultSeeker</text><text x="98" y="268" font-size="10" fill="#9C9C95" font-weight="400">Blockchain transaction forensics</text><text x="72" y="284" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">05</text><text x="98" y="284" font-size="12.5" fill="#171715" font-weight="500">RepoMedic-Agent</text><text x="98" y="298" font-size="10" fill="#9C9C95" font-weight="400">Repository health agent</text><text x="72" y="314" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">10</text><text x="98" y="314" font-size="12.5" fill="#171715" font-weight="500">neuroops</text><text x="98" y="328" font-size="10" fill="#9C9C95" font-weight="400">Autonomous SRE for Kubernetes</text><text x="72" y="344" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">16</text><text x="98" y="344" font-size="12.5" fill="#171715" font-weight="500">Airgap NOC Copilot</text><text x="98" y="358" font-size="10" fill="#9C9C95" font-weight="400">Offline NOC copilot for MPLS and SD-WAN</text><text x="72" y="374" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">17</text><text x="98" y="374" font-size="12.5" fill="#171715" font-weight="500">RecoverOS</text><text x="98" y="388" font-size="10" fill="#9C9C95" font-weight="400">Policy-governed revenue recovery</text><rect x="428" y="132" width="344" height="3" rx="1.5" fill="#4F8F6C"/><text x="428" y="158" font-size="9" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.8">DIVISION 02</text><text x="428" y="178" font-size="14.5" fill="#171715" font-weight="600">Grounded Retrieval</text><text x="428" y="198" font-size="11.5" fill="#63635D" font-weight="400">Can a model answer only from evidence</text><text x="428" y="213" font-size="11.5" fill="#63635D" font-weight="400">it is able to cite?</text><rect x="428" y="228" width="344" height="164" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="428" y="240" width="2.5" height="140" rx="1.25" fill="#4F8F6C"/><text x="444" y="254" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">02</text><text x="470" y="254" font-size="12.5" fill="#171715" font-weight="500">StudyMind</text><text x="470" y="268" font-size="10" fill="#9C9C95" font-weight="400">Study assistant over your own PDFs</text><text x="444" y="284" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">09</text><text x="470" y="284" font-size="12.5" fill="#171715" font-weight="500">AI-Sakhi</text><text x="470" y="298" font-size="10" fill="#9C9C95" font-weight="400">Multilingual study companion</text><text x="444" y="314" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">11</text><text x="470" y="314" font-size="12.5" fill="#171715" font-weight="500">VetAid</text><text x="470" y="328" font-size="10" fill="#9C9C95" font-weight="400">First-aid RAG for pet emergencies</text><rect x="800" y="132" width="344" height="3" rx="1.5" fill="#B07C34"/><text x="800" y="158" font-size="9" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.8">DIVISION 03</text><text x="800" y="178" font-size="14.5" fill="#171715" font-weight="600">Perception and Vision</text><text x="800" y="198" font-size="11.5" fill="#63635D" font-weight="400">Can a machine read the physical world</text><text x="800" y="213" font-size="11.5" fill="#63635D" font-weight="400">well enough to act on it?</text><rect x="800" y="228" width="344" height="164" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="800" y="240" width="2.5" height="140" rx="1.25" fill="#B07C34"/><text x="816" y="254" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">03</text><text x="842" y="254" font-size="12.5" fill="#171715" font-weight="500">Pothole-Detection</text><text x="842" y="268" font-size="10" fill="#9C9C95" font-weight="400">Real-time road defect detection</text><text x="816" y="284" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">07</text><text x="842" y="284" font-size="12.5" fill="#171715" font-weight="500">ecosentinel</text><text x="842" y="298" font-size="10" fill="#9C9C95" font-weight="400">Environmental intelligence platform</text><text x="816" y="314" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">15</text><text x="842" y="314" font-size="12.5" fill="#171715" font-weight="500">ReloopAI</text><text x="842" y="328" font-size="10" fill="#9C9C95" font-weight="400">Circular resource exchange, matched by AI</text><rect x="56" y="428" width="344" height="3" rx="1.5" fill="#7E6EAF"/><text x="56" y="454" font-size="9" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.8">DIVISION 04</text><text x="56" y="474" font-size="14.5" fill="#171715" font-weight="600">Systems and Simulation</text><text x="56" y="494" font-size="11.5" fill="#63635D" font-weight="400">Can we test the consequence before</text><text x="56" y="509" font-size="11.5" fill="#63635D" font-weight="400">it reaches the world?</text><rect x="56" y="524" width="344" height="164" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="56" y="536" width="2.5" height="140" rx="1.25" fill="#7E6EAF"/><text x="72" y="550" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">04</text><text x="98" y="550" font-size="12.5" fill="#171715" font-weight="500">Deploy-Platform</text><text x="98" y="564" font-size="10" fill="#9C9C95" font-weight="400">Push a zip, get a live URL</text><text x="72" y="580" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">06</text><text x="98" y="580" font-size="12.5" fill="#171715" font-weight="500">LifeSim-AI</text><text x="98" y="594" font-size="10" fill="#9C9C95" font-weight="400">Deterministic life simulation, narrated</text><text x="72" y="610" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">08</text><text x="98" y="610" font-size="12.5" fill="#171715" font-weight="500">SETRS</text><text x="98" y="624" font-size="10" fill="#9C9C95" font-weight="400">Emergency corridor orchestration</text><rect x="428" y="428" width="344" height="3" rx="1.5" fill="#3F8C97"/><text x="428" y="454" font-size="9" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.8">DIVISION 05</text><text x="428" y="474" font-size="14.5" fill="#171715" font-weight="600">Security and Assurance</text><text x="428" y="494" font-size="11.5" fill="#63635D" font-weight="400">Can a pipeline prove it was not</text><text x="428" y="509" font-size="11.5" fill="#63635D" font-weight="400">tampered with?</text><rect x="428" y="524" width="344" height="164" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="428" y="536" width="2.5" height="140" rx="1.25" fill="#3F8C97"/><text x="444" y="550" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">12</text><text x="470" y="550" font-size="12.5" fill="#171715" font-weight="500">Sentinel-FL</text><text x="470" y="564" font-size="10" fill="#9C9C95" font-weight="400">Backdoor immune system for federated learning</text><text x="444" y="580" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">13</text><text x="470" y="580" font-size="12.5" fill="#171715" font-weight="500">Actionguard Autoaudit</text><text x="470" y="594" font-size="10" fill="#9C9C95" font-weight="400">Auditing and remediation for CI pipelines</text><text x="444" y="610" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">14</text><text x="470" y="610" font-size="12.5" fill="#171715" font-weight="500">Actionguard CI</text><text x="470" y="624" font-size="10" fill="#9C9C95" font-weight="400">Workflow security auditor with reports</text></svg>