<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" width="1200" height="476" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Research log, March to August 2026</title><desc id="d">A timeline of 17 repositories created between March and August 2026, in five phases: tools first in March, applied systems in April, rigour in May, grounded and hardened in July, and bounded autonomy in August.</desc><style>.fu{animation:fu .75s cubic-bezier(.16,.84,.44,1) both}@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fi{animation:fi .9s ease both}@keyframes fi{from{opacity:0}to{opacity:1}}.dr{animation:dr 1.5s cubic-bezier(.4,0,.2,1) both}@keyframes dr{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 3.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.14;transform:scale(1)}50%{opacity:.42;transform:scale(1.85)}}@media(prefers-reduced-motion:reduce){.fu,.fi,.dr,.pu{animation:none!important}}</style><rect x="0" y="0" width="1200" height="476" rx="0" fill="#FFFFFF"/><g class="fu"><text x="56" y="46" font-size="10.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.2">RESEARCH LOG</text><text x="56" y="74" font-size="17" fill="#171715" font-weight="600">Six months</text><text x="56" y="96" font-size="12.5" fill="#63635D" font-weight="400">17 repositories, in the order they were created.</text></g><g class="fu" style="animation-delay:0.08s"><rect x="56" y="124" width="204.8" height="150" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="56" y="124" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.4"/><text x="72" y="152" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 01  ·  MARCH</text><text x="72" y="174" font-size="13" fill="#171715" font-weight="600">Tools first</text><text x="72" y="196" font-size="10.5" fill="#63635D" font-weight="400">A forensics engine, a repo auditor,</text><text x="72" y="210" font-size="10.5" fill="#63635D" font-weight="400">a detector and a deployment</text><text x="72" y="224" font-size="10.5" fill="#63635D" font-weight="400">platform. Instruments before</text><text x="72" y="238" font-size="10.5" fill="#63635D" font-weight="400">experiments.</text><line x1="72" y1="246" x2="244.8" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="72" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">4 repositories</text></g><g class="fu" style="animation-delay:0.17s"><rect x="276.8" y="124" width="204.8" height="150" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="276.8" y="124" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.54"/><text x="292.8" y="152" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 02  ·  APRIL</text><text x="292.8" y="174" font-size="13" fill="#171715" font-weight="600">Applied systems</text><text x="292.8" y="196" font-size="10.5" fill="#63635D" font-weight="400">Simulation, sensing and</text><text x="292.8" y="210" font-size="10.5" fill="#63635D" font-weight="400">orchestration. The instruments get</text><text x="292.8" y="224" font-size="10.5" fill="#63635D" font-weight="400">pointed at real domains.</text><line x1="292.8" y1="246" x2="465.6" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="292.8" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">4 repositories</text></g><g class="fu" style="animation-delay:0.26s"><rect x="497.6" y="124" width="204.8" height="150" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="497.6" y="124" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.68"/><text x="513.6" y="152" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 03  ·  MAY</text><text x="513.6" y="174" font-size="13" fill="#171715" font-weight="600">Rigour</text><text x="513.6" y="196" font-size="10.5" fill="#63635D" font-weight="400">Attribution, refusal and</text><text x="513.6" y="210" font-size="10.5" fill="#63635D" font-weight="400">self-observability become</text><text x="513.6" y="224" font-size="10.5" fill="#63635D" font-weight="400">requirements, not extras.</text><line x1="513.6" y1="246" x2="686.4" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="513.6" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">2 repositories</text></g><g class="fu" style="animation-delay:0.35s"><rect x="718.4" y="124" width="204.8" height="150" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="718.4" y="124" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.8200000000000001"/><text x="734.4" y="152" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 04  ·  JULY</text><text x="734.4" y="174" font-size="13" fill="#171715" font-weight="600">Grounded and hardened</text><text x="734.4" y="196" font-size="10.5" fill="#63635D" font-weight="400">Retrieval that cites, plus three</text><text x="734.4" y="210" font-size="10.5" fill="#63635D" font-weight="400">systems whose whole job is</text><text x="734.4" y="224" font-size="10.5" fill="#63635D" font-weight="400">proving a pipeline is intact.</text><line x1="734.4" y1="246" x2="907.2" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="734.4" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">5 repositories</text></g><g class="fu" style="animation-delay:0.44s"><rect x="939.2" y="124" width="204.8" height="150" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="939.2" y="124" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.9600000000000001"/><text x="955.2" y="152" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 05  ·  AUGUST</text><text x="955.2" y="174" font-size="13" fill="#171715" font-weight="600">Bounded autonomy</text><text x="955.2" y="196" font-size="10.5" fill="#63635D" font-weight="400">Agents that act on money and on</text><text x="955.2" y="210" font-size="10.5" fill="#63635D" font-weight="400">networks, under policy, offline,</text><text x="955.2" y="224" font-size="10.5" fill="#63635D" font-weight="400">with an audit trail.</text><line x1="955.2" y1="246" x2="1128" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="955.2" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">2 repositories</text></g><line x1="56" y1="384" x2="1144" y2="384" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt" stroke-dasharray="1088.0" class="dr" style="--L:1088.0;animation-delay:0.4s"/><g class="fu" style="animation-delay:0.55s"><line x1="64" y1="358" x2="64" y2="384" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="64" cy="384" r="4.5" fill="#FFFFFF" stroke="#3D7DE8" stroke-width="1.6"/><circle cx="64" cy="384" r="2" fill="#3D7DE8"/><text x="64" y="348" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">FaultSeeker</text><text x="64" y="336" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">01</text></g><g class="fu" style="animation-delay:0.59s"><line x1="131" y1="384" x2="131" y2="410" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="131" cy="384" r="4.5" fill="#FFFFFF" stroke="#4F8F6C" stroke-width="1.6"/><circle cx="131" cy="384" r="2" fill="#4F8F6C"/><text x="131" y="430" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">StudyMind</text><text x="131" y="442" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">02</text></g><g class="fu" style="animation-delay:0.63s"><line x1="198" y1="358" x2="198" y2="384" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="198" cy="384" r="4.5" fill="#FFFFFF" stroke="#B07C34" stroke-width="1.6"/><circle cx="198" cy="384" r="2" fill="#B07C34"/><text x="198" y="348" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">Pothole-Detection</text><text x="198" y="336" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">03</text></g><g class="fu" style="animation-delay:0.67s"><line x1="265" y1="384" x2="265" y2="410" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="265" cy="384" r="4.5" fill="#FFFFFF" stroke="#7E6EAF" stroke-width="1.6"/><circle cx="265" cy="384" r="2" fill="#7E6EAF"/><text x="265" y="430" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">Deploy-Platform</text><text x="265" y="442" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">04</text></g><g class="fu" style="animation-delay:0.71s"><line x1="332" y1="358" x2="332" y2="384" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="332" cy="384" r="4.5" fill="#FFFFFF" stroke="#3D7DE8" stroke-width="1.6"/><circle cx="332" cy="384" r="2" fill="#3D7DE8"/><text x="332" y="348" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">RepoMedic-Agent</text><text x="332" y="336" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">05</text></g><g class="fu" style="animation-delay:0.75s"><line x1="399" y1="384" x2="399" y2="410" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="399" cy="384" r="4.5" fill="#FFFFFF" stroke="#7E6EAF" stroke-width="1.6"/><circle cx="399" cy="384" r="2" fill="#7E6EAF"/><text x="399" y="430" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">LifeSim-AI</text><text x="399" y="442" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">06</text></g><g class="fu" style="animation-delay:0.79s"><line x1="466" y1="358" x2="466" y2="384" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="466" cy="384" r="4.5" fill="#FFFFFF" stroke="#B07C34" stroke-width="1.6"/><circle cx="466" cy="384" r="2" fill="#B07C34"/><text x="466" y="348" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">ecosentinel</text><text x="466" y="336" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">07</text></g><g class="fu" style="animation-delay:0.83s"><line x1="533" y1="384" x2="533" y2="410" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="533" cy="384" r="4.5" fill="#FFFFFF" stroke="#7E6EAF" stroke-width="1.6"/><circle cx="533" cy="384" r="2" fill="#7E6EAF"/><text x="533" y="430" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">SETRS</text><text x="533" y="442" font-size=