utt"/><circle cx="1002" cy="384" r="4.5" fill="#FFFFFF" stroke="#B07C34" stroke-width="1.6"/><circle cx="1002" cy="384" r="2" fill="#B07C34"/><text x="1002" y="348" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">ReloopAI</text><text x="1002" y="336" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">15</text></g><g class="fu" style="animation-delay:1.15s"><line x1="1069" y1="384" x2="1069" y2="410" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="1069" cy="384" r="4.5" fill="#FFFFFF" stroke="#3D7DE8" stroke-width="1.6"/><circle cx="1069" cy="384" r="2" fill="#3D7DE8"/><text x="1069" y="430" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">Airgap NOC Copilot</text><text x="1069" y="442" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">16</text></g><g class="fu" style="animation-delay:1.19s"><line x1="1136" y1="358" x2="1136" y2="384" stroke="#D4D4D0" stroke-width="1" stroke-linecap="butt"/><circle cx="1136" cy="384" r="4.5" fill="#FFFFFF" stroke="#3D7DE8" stroke-width="1.6"/><circle cx="1136" cy="384" r="2" fill="#3D7DE8"/><text x="1136" y="348" font-size="10" fill="#171715" font-weight="500" text-anchor="middle">RecoverOS</text><text x="1136" y="336" font-size="8.5" fill="#9C9C95" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1">17</text></g></svg>