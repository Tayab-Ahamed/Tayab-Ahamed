<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Lab map: four research divisions</title><desc id="d">The twelve repositories arranged as four research divisions with three experiments each. Division 01 autonomous agents: FaultSeeker, RepoMedic-Agent, neuroops. Division 02 grounded retrieval: StudyMind, AI-Sakhi, vetaid-rag-assistant. Division 03 perception and vision: Pothole-Detection, ecosentinel, ReloopAI. Division 04 systems and simulation: Deploy-Platform, LifeSim-AI, SETRS-Trajectory-Preemption.</desc><rect x="0" y="0" width="1200" height="630" rx="0" fill="#0C0C0B"/><text x="56" y="46" font-size="10.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.2">LAB MAP</text><text x="56" y="74" font-size="17" fill="#F4F4F1" font-weight="600">Four divisions. Three experiments each.</text><text x="56" y="96" font-size="12.5" fill="#A0A099" font-weight="400">Grouped by the question the work is asking, not by language.</text><line x1="56" y1="112" x2="1144" y2="112" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><rect x="56" y="128" width="257" height="3" rx="1.5" fill="#6BA3F0"/><text x="56" y="152" font-size="9" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.8">DIVISION 01</text><text x="56" y="172" font-size="14.5" fill="#F4F4F1" font-weight="600">Autonomous Agents</text><text x="56" y="192" font-size="11.5" fill="#A0A099" font-weight="400">Can a system diagnose a fault and act on it</text><text x="56" y="207" font-size="11.5" fill="#A0A099" font-weight="400">without a human in the loop?</text><rect x="56" y="220" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="56" y="232" width="2.5" height="80" rx="1.25" fill="#6BA3F0"/><text x="72" y="246" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-01</text><text x="72" y="266" font-size="12.5" fill="#F4F4F1" font-weight="600">FaultSeeker-</text><text x="72" y="285" font-size="11" fill="#A0A099" font-weight="400">Blockchain transaction forensics</text><text x="72" y="310" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.3">PYTHON</text><rect x="56" y="338" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="56" y="350" width="2.5" height="80" rx="1.25" fill="#6BA3F0"/><text x="72" y="364" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-05</text><text x="72" y="384" font-size="12.5" fill="#F4F4F1" font-weight="600">RepoMedic-Agent</text><text x="72" y="403" font-size="11" fill="#A0A099" font-weight="400">Repository health agent</text><text x="72" y="428" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.3">JAVASCRIPT</text><rect x="56" y="456" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="56" y="468" width="2.5" height="80" rx="1.25" fill="#6BA3F0"/><text x="72" y="482" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-10</text><text x="72" y="502" font-size="12.5" fill="#F4F4F1" font-weight="600">neuroops</text><text x="72" y="521" font-size="11" fill="#A0A099" font-weight="400">Autonomous SRE for Kubernetes</text><text x="72" y="546" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.3">PYTHON</text><rect x="333" y="128" width="257" height="3" rx="1.5" fill="#7FBF9C"/><text x="333" y="152" font-size="9" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.8">DIVISION 02</text><text x="333" y="172" font-size="14.5" fill="#F4F4F1" font-weight="600">Grounded Retrieval</text><text x="333" y="192" font-size="11.5" fill="#A0A099" font-weight="400">Can a model answer only from evidence it is able</text><text x="333" y="207" font-size="11.5" fill="#A0A099" font-weight="400">to cite?</text><rect x="333" y="220" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="333" y="232" width="2.5" height="80" rx="1.25" fill="#7FBF9C"/><text x="349" y="246" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-02</text><text x="349" y="266" font-size="12.5" fill="#F4F4F1" font-weight="600">StudyMind</text><text x="349" y="285" font-size="11" fill="#A0A099" font-weight="400">Study assistant over your own PDFs</text><text x="349" y="310" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.3">JAVASCRIPT</text><rect x="333" y="338" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="333" y="350" width="2.5" height="80" rx="1.25" fill="#7FBF9C"/><text x="349" y="364" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-09</text><text x="349" y="384" font-size="12.5" fill="#F4F4F1" font-weight="600">AI-Sakhi</text><text x="349" y="403" font-size="11" fill="#A0A099" font-weight="400">Adaptive tutoring system</text><text x="349" y="428" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.3">TYPESCRIPT</text><rect x="333" y="456" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="333" y="468" width="2.5" height="80" rx="1.25" fill="#7FBF9C"/><text x="349" y="482" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-11</text><text x="349" y="502" font-size="12.5" fill="#F4F4F1" font-weight="600">vetaid-rag-assistant</text><text x="349" y="521" font-size="11" fill="#A0A099" font-weight="400">Veterinary first-aid assistant</text><text x="349" y="546" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.3">PYTHON</text><rect x="610" y="128" width="257" height="3" rx="1.5" fill="#D6A45A"/><text x="610" y="152" font-size="9" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.8">DIVISION 03</text><text x="610" y="172" font-size="14.5" fill="#F4F4F1" font-weight="600">Perception and Vision</text><text x="610" y="192" font-size="11.5" fill="#A0A099" font-weight="400">Can a single camera frame become a decision?</text><rect x="610" y="220" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="610" y="232" width="2.5" height="80" rx="1.25" fill="#D6A45A"/><text x="626" y="246" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-03</text><text x="626" y="266" font-size="12.5" fill="#F4F4F1" font-weight="600">Pothole-Detection</text><text x="626" y="285" font-size="11" fill="#A0A099" font-weight="400">Real-time road defect detection</text><text x="626" y="310" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.3">PYTHON</text><rect x="610" y="338" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="610" y="350" width="2.5" height="80" rx="1.25" fill="#D6A45A"/><text x="626" y="364" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-07</text><text x="626" y="384" font-size="12.5" fill="#F4F4F1" font-weight="600">ecosentinel</text><text x="626" y="403" font-size="11" fill="#A0A099" font-weight="400">Environmental monitoring station</text><text x="626" y="428" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.3">TYPESCRIPT</text><rect x="610" y="456" width="257" height="104" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="610" y="468" width="2.5" height="80" rx="1.25" fill="#D6A45A"/><text x="626" y="482" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.5">EXP-12</text><circle cx="849" cy="478" r="3.2" fill="#D6A45A"/><text x="626" y="502" font-size="12.5" fill="#F4F4F1" font-weight="600">ReloopAI</text><text x="626" y="521" font-size="11" fill="#A0A099" font-weight="400">Circular resource exchange</text><text x="626" y="546" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-m