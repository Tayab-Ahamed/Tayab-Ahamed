<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Research log, March to August 2026</title><desc id="d">A timeline of 17 repositories created between March and August 2026, in five phases: tools first in March, applied systems in April, rigour in May, grounded and hardened in July, and bounded autonomy in August.</desc><rect x="0" y="0" width="1200" height="470" rx="0" fill="#0C0C0B"/><text x="56" y="46" font-size="10.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.2">RESEARCH LOG</text><text x="56" y="74" font-size="17" fill="#F4F4F1" font-weight="600">Six months</text><text x="56" y="96" font-size="12.5" fill="#A0A099" font-weight="400">17 repositories, in the order they were created.</text><rect x="56" y="124" width="204.8" height="150" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="56" y="124" width="204.8" height="2.5" rx="1.25" fill="#6BA3F0" opacity="0.4"/><text x="72" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 01  ·  MARCH</text><text x="72" y="174" font-size="13" fill="#F4F4F1" font-weight="600">Tools first</text><text x="72" y="196" font-size="10.5" fill="#A0A099" font-weight="400">A forensics engine, a repo auditor,</text><text x="72" y="210" font-size="10.5" fill="#A0A099" font-weight="400">a detector and a deployment</text><text x="72" y="224" font-size="10.5" fill="#A0A099" font-weight="400">platform. Instruments before</text><text x="72" y="238" font-size="10.5" fill="#A0A099" font-weight="400">experiments.</text><line x1="72" y1="246" x2="244.8" y2="246" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><text x="72" y="262" font-size="9.5" fill="#6A6A63" font-weight="400">4 repositories</text><rect x="276.8" y="124" width="204.8" height="150" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="276.8" y="124" width="204.8" height="2.5" rx="1.25" fill="#6BA3F0" opacity="0.54"/><text x="292.8" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 02  ·  APRIL</text><text x="292.8" y="174" font-size="13" fill="#F4F4F1" font-weight="600">Applied systems</text><text x="292.8" y="196" font-size="10.5" fill="#A0A099" font-weight="400">Simulation, sensing and</text><text x="292.8" y="210" font-size="10.5" fill="#A0A099" font-weight="400">orchestration. The instruments get</text><text x="292.8" y="224" font-size="10.5" fill="#A0A099" font-weight="400">pointed at real domains.</text><line x1="292.8" y1="246" x2="465.6" y2="246" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><text x="292.8" y="262" font-size="9.5" fill="#6A6A63" font-weight="400">4 repositories</text><rect x="497.6" y="124" width="204.8" height="150" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="497.6" y="124" width="204.8" height="2.5" rx="1.25" fill="#6BA3F0" opacity="0.68"/><text x="513.6" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 03  ·  MAY</text><text x="513.6" y="174" font-size="13" fill="#F4F4F1" font-weight="600">Rigour</text><text x="513.6" y="196" font-size="10.5" fill="#A0A099" font-weight="400">Attribution, refusal and</text><text x="513.6" y="210" font-size="10.5" fill="#A0A099" font-weight="400">self-observability become</text><text x="513.6" y="224" font-size="10.5" fill="#A0A099" font-weight="400">requirements, not extras.</text><line x1="513.6" y1="246" x2="686.4" y2="246" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><text x="513.6" y="262" font-size="9.5" fill="#6A6A63" font-weight="400">2 repositories</text><rect x="718.4" y="124" width="204.8" height="150" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="718.4" y="124" width="204.8" height="2.5" rx="1.25" fill="#6BA3F0" opacity="0.8200000000000001"/><text x="734.4" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 04  ·  JULY</text><text x="734.4" y="174" font-size="13" fill="#F4F4F1" font-weight="600">Grounded and hardened</text><text x="734.4" y="196" font-size="10.5" fill="#A0A099" font-weight="400">Retrieval that cites, plus three</text><text x="734.4" y="210" font-size="10.5" fill="#A0A099" font-weight="400">systems whose whole job is</text><text x="734.4" y="224" font-size="10.5" fill="#A0A099" font-weight="400">proving a pipeline is intact.</text><line x1="734.4" y1="246" x2="907.2" y2="246" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><text x="734.4" y="262" font-size="9.5" fill="#6A6A63" font-weight="400">5 repositories</text><rect x="939.2" y="124" width="204.8" height="150" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="939.2" y="124" width="204.8" height="2.5" rx="1.25" fill="#6BA3F0" opacity="0.9600000000000001"/><text x="955.2" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 05  ·  AUGUST</text><text x="955.2" y="174" font-size="13" fill="#F4F4F1" font-weight="600">Bounded autonomy</text><text x="955.2" y="196" font-size="10.5" fill="#A0A099" font-weight="400">Agents that act on money and on</text><text x="955.2" y="210" font-size="10.5" fill="#A0A099" font-weight="400">networks, under policy, offline,</text><text x="955.2" y="224" font-size="10.5" fill="#A0A099" font-weight="400">with an audit trail.</text><line x1="955.2" y1="246" x2="1128" y2="246" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><text x="955.2" y="262" font-size="9.5" fill="#6A6A63" font-weight="400">2 repositories</text><line x1="56" y1="348" x2="1144" y2="348" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><line x1="56" y1="340" x2="56" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="56" cy="336" r="4.5" fill="#0C0C0B" stroke="#6BA3F0" stroke-width="1.6"/><circle cx="56" cy="336" r="2" fill="#6BA3F0"/><text x="56" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">01</text><g transform="translate(61,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">FaultSeeker</text></g><line x1="120.75" y1="340" x2="120.75" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="120.75" cy="336" r="4.5" fill="#0C0C0B" stroke="#74B491" stroke-width="1.6"/><circle cx="120.75" cy="336" r="2" fill="#74B491"/><text x="120.75" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">02</text><g transform="translate(125.75,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">StudyMind</text></g><line x1="185.5" y1="340" x2="185.5" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="185.5" cy="336" r="4.5" fill="#0C0C0B" stroke="#D3A45F" stroke-width="1.6"/><circle cx="185.5" cy="336" r="2" fill="#D3A45F"/><text x="185.5" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">03</text><g transform="translate(190.5,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">Pothole-Detection</text></g><line x1="250.25" y1="340" x2="250.25" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="250.25" cy="336" r="4.5" fill="#0C0C0B" stroke="#A292D0" stroke-width="1.6"/><circle cx="250.25" cy="336" r="2" fill="#A292D0"/><text x="250.25" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">04</text><g transform="translate(255.25,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">Deploy-Platform</text></g><line x1="315" y1="340" x2="315" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="315" cy="336" r="4.5" fill="#0C0C0B" stroke="#6BA3F0" stroke-width="1.6"/><circle cx="315" cy="336" r="2" fill="#6BA3F0"/><text x="315" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">05</text><g transform="translate(320,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">RepoMedic-Agent</text></g><line x1="379.75" y1="340" x2="379.75" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="379.75" cy="336" r="4.5" fill="#0C0C0B" stroke="#A292D0" stroke-width="1.6"/><circle cx="379.75" cy="336" r="2" fill="#A292D0"/><text x="379.75" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">06</text><g transform="translate(384.75,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">LifeSim-AI</text></g><line x1="444.5" y1="340" x2="444.5" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="444.5" cy="336" r="4.5" fill="#0C0C0B" stro