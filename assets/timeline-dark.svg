', monospace">10</text><g transform="translate(643.75,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">neuroops</text></g><line x1="703.5" y1="340" x2="703.5" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="703.5" cy="336" r="4.5" fill="#0C0C0B" stroke="#74B491" stroke-width="1.6"/><circle cx="703.5" cy="336" r="2" fill="#74B491"/><text x="703.5" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">11</text><g transform="translate(708.5,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">VetAid</text></g><line x1="768.25" y1="340" x2="768.25" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="768.25" cy="336" r="4.5" fill="#0C0C0B" stroke="#6FB3BE" stroke-width="1.6"/><circle cx="768.25" cy="336" r="2" fill="#6FB3BE"/><text x="768.25" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">12</text><g transform="translate(773.25,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">Sentinel-FL</text></g><line x1="833" y1="340" x2="833" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><circle cx="833" cy="336" r="4.5" fill="#0C0C0B" stroke="#6FB3BE" stroke-width="1.6"/><circle cx="833" cy="336" r="2" fill="#6FB3BE"/><text x="833" y="364" font-size="8.5" fill="#6A6A63" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">13</text><g transform="translate(838,378) rotate(-52)"><text x="0" y="0" font-size="9.5" fill="#A0A099" font-weight="400">Actionguard Autoaudit</text></g><line x1="897.75" y1="340" x2="897.75" y2="348" stroke="#37372F" stroke-width="1" stroke-linecap=