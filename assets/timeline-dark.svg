<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Research log, March to August 2026</title><desc id="d">A timeline of twelve repositories created between March and August 2026, in four phases: tools first in March, applied systems in April, rigour in May, and grounded and shipped in July.</desc><rect x="0" y="0" width="1200" height="450" rx="0" fill="#0C0C0B"/><text x="56" y="46" font-size="10.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.2">RESEARCH LOG</text><text x="56" y="74" font-size="17" fill="#F4F4F1" font-weight="600">Five months</text><text x="56" y="96" font-size="12.5" fill="#A0A099" font-weight="400">Twelve repositories, in the order they were created.</text><rect x="56" y="124" width="260" height="134" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="56" y="124" width="260" height="2.5" rx="1.25" fill="#6BA3F0" opacity="0.44"/><text x="72" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 01  ·  MARCH</text><text x="72" y="174" font-size="13.5" fill="#F4F4F1" font-weight="600">Tools first</text><text x="72" y="194" font-size="10.5" fill="#A0A099" font-weight="400">A forensics engine, a repo auditor, a detector</text><text x="72" y="207.5" font-size="10.5" fill="#A0A099" font-weight="400">and a deployment platform. Instruments before</text><text x="72" y="221" font-size="10.5" fill="#A0A099" font-weight="400">experiments.</text><rect x="332" y="124" width="260" height="134" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="332" y="124" width="260" height="2.5" rx="1.25" fill="#6BA3F0" opacity="0.62"/><text x="348" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 02  ·  APRIL</text><text x="348" y="174" font-size="13.5" fill="#F4F4F1" font-weight="600">Applied systems</text><text x="348" y="194" font-size="10.5" fill="#A0A099" font-weight="400">The same engineering pointed at real domains:</text><text x="348" y="207.5" font-size="10.5" fill="#A0A099" font-weight="400">air quality, road defects, ambulance corridors,</text><text x="348" y="221" font-size="10.5" fill="#A0A099" font-weight="400">financial consequence.</text><rect x="608" y="124" width="260" height="134" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="608" y="124" width="260" height="2.5" rx="1.25" fill="#6BA3F0" opacity="0.81"/><text x="624" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 03  ·  MAY</text><text x="624" y="174" font-size="13.5" fill="#F4F4F1" font-weight="600">Rigour</text><text x="624" y="194" font-size="10.5" fill="#A0A099" font-weight="400">AI-Sakhi adds refusal thresholds and auditable</text><text x="624" y="207.5" font-size="10.5" fill="#A0A099" font-weight="400">classifiers. neuroops makes the agent</text><text x="624" y="221" font-size="10.5" fill="#A0A099" font-weight="400">observable to itself.</text><rect x="884" y="124" width="260" height="134" rx="8" fill="#131312" stroke="#282826" stroke-width="1"/><rect x="884" y="124" width="260" height="2.5" rx="1.25" fill="#6BA3F0" opacity="1"/><text x="900" y="152" font-size="8.5" fill="#6A6A63" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">PHASE 04  ·  JULY</text><text x="900" y="174" font-size="13.5" fill="#F4F4F1" font-weight="600">Grounded and shipped</text><text x="900" y="194" font-size="10.5" fill="#A0A099" font-weight="400">VetAid cites every step. ReloopAI goes to</text><text x="900" y="207.5" font-size="10.5" fill="#A0A099" font-weight="400">production and becomes the most committed-to</text><text x="900" y="221" font-size="10.5" fill="#A0A099" font-weight="400">repository of the twelve.</text><line x1="64" y1="300" x2="1136" y2="300" stroke="#37372F" stroke-width="1.25" stroke-linecap="butt"/><line x1="64" y1="294" x2="64" y2="300" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><text x="64" y="286" font-size="8.5" fill="#6A6A63" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">MAR</text><line x1="245.6" y1="294" x2="245.6" y2="300" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><text x="245.6" y="286" font-size="8.5" fill="#6A6A63" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">APR</text><line x1="421.33" y1="294" x2="421.33" y2="300" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><text x="421.33" y="286" font-size="8.5" fill="#6A6A63" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">MAY</text><line x1="602.93" y1="294" x2="602.93" y2="300" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><text x="602.93" y="286" font-size="8.5" fill="#6A6A63" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">JUN</text><line x1="778.67" y1="294" x2="778.67" y2="300" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><text x="778.67" y="286" font-size="8.5" fill="#6A6A63" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">JUL</text><line x1="960.26" y1="294" x2="960.26" y2="300" stroke="#37372F" stroke-width="1" stroke-linecap="butt"/><text x="960.26" y="286" font-size="8.5" fill="#6A6A63" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">AUG</text><line x1="134.3" y1="300" x2="134.3" y2="320" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="134.3" cy="300" r="4.6" fill="#6BA3F0"/><circle cx="134.3" cy="320" r="1.7" fill="#6BA3F0"/><text x="142.3" y="323.5" font-size="10" fill="#A0A099" font-weight="400">01 FaultSeeker-</text><line x1="198.73" y1="300" x2="198.73" y2="339" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="198.73" cy="300" r="4.6" fill="#7FBF9C"/><circle cx="198.73" cy="339" r="1.7" fill="#7FBF9C"/><text x="206.73" y="342.5" font-size="10" fill="#A0A099" font-weight="400">02 StudyMind</text><line x1="216.31" y1="300" x2="216.31" y2="358" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="216.31" cy="300" r="4.6" fill="#D6A45A"/><circle cx="216.31" cy="358" r="1.7" fill="#D6A45A"/><text x="224.31" y="361.5" font-size="10" fill="#A0A099" font-weight="400">03 Pothole-Detection</text><line x1="233.88" y1="300" x2="233.88" y2="377" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="233.88" cy="300" r="4.6" fill="#A796D8"/><circle cx="233.88" cy="377" r="1.7" fill="#A796D8"/><text x="241.88" y="380.5" font-size="10" fill="#A0A099" font-weight="400">04 Deploy-Platform</text><line x1="257.31" y1="300" x2="257.31" y2="320" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="257.31" cy="300" r="4.6" fill="#6BA3F0"/><circle cx="257.31" cy="320" r="1.7" fill="#6BA3F0"/><text x="265.31" y="323.5" font-size="10" fill="#A0A099" font-weight="400">05 RepoMedic-Agent</text><line x1="292.46" y1="300" x2="292.46" y2="339" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="292.46" cy="300" r="4.6" fill="#A796D8"/><circle cx="292.46" cy="339" r="1.7" fill="#A796D8"/><text x="300.46" y="342.5" font-size="10" fill="#A0A099" font-weight="400">06 LifeSim-AI</text><line x1="351.04" y1="300" x2="351.04" y2="358" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="351.04" cy="300" r="4.6" fill="#D6A45A"/><circle cx="351.04" cy="358" r="1.7" fill="#D6A45A"/><text x="359.04" y="361.5" font-size="10" fill="#A0A099" font-weight="400">07 ecosentinel</text><line x1="392.04" y1="300" x2="392.04" y2="320" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="392.04" cy="300" r="4.6" fill="#A796D8"/><circle cx="392.04" cy="320" r="1.7" fill="#A796D8"/><text x="400.04" y="323.5" font-size="10" fill="#A0A099" font-weight="400">08 SETRS-Trajectory-Preemption</text><line x1="485.77" y1="300" x2="485.77" y2="339" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="485.77" cy="300" r="4.6" fill="#7FBF9C"/><circle cx="485.77" cy="339" r="1.7" fill="#7FBF9C"/><text x="493.77" y="342.5" font-size="10" fill="#A0A099" font-weight="400">09 AI-Sakhi</text><line x1="544.35" y1="300" x2="544.35" y2="358" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="544.35" cy="300" r="4.6" fill="#6BA3F0"/><circle cx="544.35" cy="358" r="1.7" fill="#6BA3F0"/><text x="552.35" y="361.5" font-size="10" fill="#A0A099" font-weight="400">10 neuroops</text><line x1="784.52" y1="300" x2="784.52" y2="320" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="784.52" cy="300" r="4.6" fill="#7FBF9C"/><circle cx="784.52" cy="320" r="1.7" fill="#7FBF9C"/><text x="792.52" y="323.5" font-size="10" fill="#A0A099" font-weight="400">11 vetaid-rag-assistant</text><line x1="848.96" y1="300" x2="848.96" y2="339" stroke="#282826" stroke-width="1" stroke-linecap="butt"/><circle cx="848.96" cy="300" r="4.6" fill="#D6A45A"/><circle cx="848.96" cy="339" r="1.7" fill="#D6A45A"/><text x="856.96" y="342.5" font-size="10" fill="#A0A099" font-weight="400">12 ReloopAI</text><text x="56" y="432" font-size="10" fill="#6A6A63" font-weight="400">Two March repositories report no exact day; they are placed inside the window their repository ids allow.</text></svg>
