<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" width="1200" height="348" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Development workflow</title><desc id="d">Five steps observed across the repositories: frame the failure, model the world first, route never bind, make it cite, and gate the release. Each step lists the repositories that demonstrate it.</desc><rect x="0" y="0" width="1200" height="348" rx="0" fill="#FFFFFF"/><text x="56" y="46" font-size="10.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="3.2">METHOD</text><text x="56" y="74" font-size="17" fill="#171715" font-weight="600">How a system gets built here</text><text x="56" y="96" font-size="12.5" fill="#63635D" font-weight="400">Not a manifesto. This is the order the repositories were actually assembled in.</text><rect x="56" y="130" width="204.8" height="152" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="56" y="130" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.4"/><text x="72" y="158" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">STEP 1</text><text x="72" y="180" font-size="13.5" fill="#171715" font-weight="600">Frame the failure</text><text x="72" y="203" font-size="11" fill="#63635D" font-weight="400">Start from what breaking looks</text><text x="72" y="217" font-size="11" fill="#63635D" font-weight="400">like, not from the feature.</text><line x1="72" y1="246" x2="244.8" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="72" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">SETRS · VetAid · neuroops</text><path d="M266.8 202 l4 4 l-4 4" fill="none" stroke="#9C9C95" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="276.8" y="130" width="204.8" height="152" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="276.8" y="130" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.55"/><text x="292.8" y="158" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">STEP 2</text><text x="292.8" y="180" font-size="13.5" fill="#171715" font-weight="600">Model the world first</text><text x="292.8" y="203" font-size="11" fill="#63635D" font-weight="400">Build a simulation or a rules</text><text x="292.8" y="217" font-size="11" fill="#63635D" font-weight="400">engine that is authoritative.</text><line x1="292.8" y1="246" x2="465.6" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="292.8" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">SUMO · LifeSim rules · chaos runs</text><path d="M487.6 202 l4 4 l-4 4" fill="none" stroke="#9C9C95" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="497.6" y="130" width="204.8" height="152" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="497.6" y="130" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.7"/><text x="513.6" y="158" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">STEP 3</text><text x="513.6" y="180" font-size="13.5" fill="#171715" font-weight="600">Route, never bind</text><text x="513.6" y="203" font-size="11" fill="#63635D" font-weight="400">Two or more providers behind one</text><text x="513.6" y="217" font-size="11" fill="#63635D" font-weight="400">interface, plus a mock.</text><line x1="513.6" y1="246" x2="686.4" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="513.6" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">FaultSeeker · ReloopAI · LifeSim</text><path d="M708.4 202 l4 4 l-4 4" fill="none" stroke="#9C9C95" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="718.4" y="130" width="204.8" height="152" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="718.4" y="130" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="0.85"/><text x="734.4" y="158" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">STEP 4</text><text x="734.4" y="180" font-size="13.5" fill="#171715" font-weight="600">Make it cite</text><text x="734.4" y="203" font-size="11" fill="#63635D" font-weight="400">Attribution, thresholds, calibrated</text><text x="734.4" y="217" font-size="11" fill="#63635D" font-weight="400">confidence, refusal.</text><line x1="734.4" y1="246" x2="907.2" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="734.4" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">AI-Sakhi · VetAid · FaultSeeker</text><path d="M929.2 202 l4 4 l-4 4" fill="none" stroke="#9C9C95" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="939.2" y="130" width="204.8" height="152" rx="8" fill="#FAFAF9" stroke="#E3E3E0" stroke-width="1"/><rect x="939.2" y="130" width="204.8" height="2.5" rx="1.25" fill="#2F6FD0" opacity="1"/><text x="955.2" y="158" font-size="8.5" fill="#9C9C95" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="1.6">STEP 5</text><text x="955.2" y="180" font-size="13.5" fill="#171715" font-weight="600">Gate the release</text><text x="955.2" y="203" font-size="11" fill="#63635D" font-weight="400">Tests, CI and self-audit before it</text><text x="955.2" y="217" font-size="11" fill="#63635D" font-weight="400">counts as done.</text><line x1="955.2" y1="246" x2="1128" y2="246" stroke="#E3E3E0" stroke-width="1" stroke-linecap="butt"/><text x="955.2" y="262" font-size="9.5" fill="#9C9C95" font-weight="400">RepoMedic · AI-Sakhi · ReloopAI</text></svg>
